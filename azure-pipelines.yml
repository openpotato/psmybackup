pool:
  vmImage: "windows-latest"

variables:
  - group: "code-sign-config"
  - group: "powershell-config"
  - group: "github-config"

stages:
  - stage: versioning
    displayName: Get Version
    jobs:
      - job: get_version
        displayName: Get Version from Git tags
        steps:
          - checkout: self
            fetchTags: true
            fetchDepth: 0
          - task: PowerShell@2
            displayName: "Generate Semantic Version"
            name: gitver
            inputs:
              filePath: "azure-gitversion.ps1"
              failOnStderr: true
              pwsh: true

  - stage: validation
    displayName: Validate
    dependsOn: []
    jobs:
      - job: quality_gate
        displayName: Pester and script analysis
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Install test and analysis tools"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                # Pin Pester so local and CI runs use the same major/minor behavior.
                Install-Module Pester -RequiredVersion '6.2.0' -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop

                # ScriptAnalyzer is used only for static diagnostics.
                Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

          - task: PowerShell@2
            displayName: "Run Pester unit and integration tests"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                Import-Module Pester -RequiredVersion '6.2.0' -ErrorAction Stop

                # The module requires PowerShell 7.5 for ConvertFrom-Json -DateKind String.
                # The version check also ensures full Draft 2020-12 schema test support.
                if ($PSVersionTable.PSVersion -lt [version]'7.5') {
                  throw 'PsMyBackup and its tests require PowerShell 7.5 or later.'
                }

                # Run both unit and integration suites. -PassThru is necessary because test failures do not 
                # automatically fail this task.
                $results = Invoke-Pester -Path '$(Build.SourcesDirectory)/test' -Output Detailed -PassThru

                # Treat a missing test suite as a failure, not a green build.
                if ($results.TotalCount -eq 0) {
                  throw 'Pester discovered no tests.'
                }
                if ($results.FailedCount -gt 0 -or $results.NotRunCount -gt 0) {
                  throw "Pester failed: $($results.FailedCount) failures and $($results.NotRunCount) not run."
                }

          - task: PowerShell@2
            displayName: "Run PSScriptAnalyzer"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                Import-Module PSScriptAnalyzer -ErrorAction Stop

                # Analyze all repository PowerShell files, including the module, build scripts,
                # examples, and tests. Treat both warnings and errors as quality-gate failures.
                $repositoryRoot = '$(Build.SourcesDirectory)'
                $findings = @(
                  Invoke-ScriptAnalyzer -Path $repositoryRoot -Recurse -Severity Error,Warning -ErrorAction Stop
                )
                foreach ($finding in $findings) {
                  Write-Host ("{0}: {1} at {2}:{3} - {4}" -f `
                    $finding.Severity, $finding.RuleName, $finding.ScriptPath, $finding.Line, $finding.Message)
                }
                if ($findings.Count -gt 0) {
                  throw "PSScriptAnalyzer found $($findings.Count) error/warning diagnostic(s)."
                }

  - stage: packaging
    displayName: Pack
    dependsOn: [versioning, validation]
    variables:
      MajorVersion: $[ stageDependencies.versioning.get_version.outputs['gitver.MajorVersion'] ]
      MinorVersion: $[ stageDependencies.versioning.get_version.outputs['gitver.MinorVersion'] ]
      PatchVersion: $[ stageDependencies.versioning.get_version.outputs['gitver.PatchVersion'] ]
    jobs:
      - job: create_packages
        displayName: Pack and Sign
        steps:
          - checkout: self
          - task: DownloadSecureFile@1
            displayName: "Download Client Authentication Certificate"
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            name: SM_CLIENT_CERT_FILE
            inputs:
              secureFile: ClientCert.p12
          - task: SSMClientToolsSetup@1
            displayName: "Setup DigiCert Tools"
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              APIKey: "$(SM_API_KEY)"
          - task: PowerShell@2
            displayName: "Prepare DigiCert Code Signing"
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            env:
              SM_HOST: $(SM_HOST)
              SM_API_KEY: $(SM_API_KEY)
              SM_CLIENT_CERT_FILE: $(SM_CLIENT_CERT_FILE.secureFilePath)
              SM_CLIENT_CERT_PASSWORD: $(SM_CLIENT_CERT_PASSWORD)
            inputs:
              targetType: "inline"
              script: |
                $env:PATH += ';C:\Program Files\DigiCert\DigiCert One Signing Manager Tools'
                smctl windows certsync --keypair-alias=$(SM_KEYPAIR_ALIAS)
                if ($LASTEXITCODE -ne 0) {
                  throw "DigiCert certificate synchronization failed (exit code $LASTEXITCODE)."
                }
              failOnStderr: true
              pwsh: true
          - task: PowerShell@2
            displayName: "Update Module Version"
            inputs:
              targetType: "inline"
              script: |
                Update-ModuleManifest `
                  -Path "$(Build.SourcesDirectory)/src/PsMyBackup/PsMyBackup.psd1" `
                  -ModuleVersion "$(MajorVersion).$(MinorVersion).$(PatchVersion)" `
                  -ErrorAction Stop
              pwsh: true
          - task: PowerShell@2
            displayName: "Sign Module"
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            env:
              SM_HOST: $(SM_HOST)
              SM_API_KEY: $(SM_API_KEY)
              SM_CLIENT_CERT_FILE: $(SM_CLIENT_CERT_FILE.secureFilePath)
              SM_CLIENT_CERT_PASSWORD: $(SM_CLIENT_CERT_PASSWORD)
            inputs:
              targetType: "inline"
              script: |
                $env:PATH += ';C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64'
                signtool.exe sign /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /sha1 $(SM_CERT_FINGERPRINT) $(Build.SourcesDirectory)/src/PsMyBackup/PsMyBackup.psm1
                if ($LASTEXITCODE -ne 0) { throw 'Signing PsMyBackup.psm1 failed.' }
                signtool.exe sign /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /sha1 $(SM_CERT_FINGERPRINT) $(Build.SourcesDirectory)/src/PsMyBackup/PsMyBackup.psd1
                if ($LASTEXITCODE -ne 0) { throw 'Signing PsMyBackup.psd1 failed.' }
              failOnStderr: true
              pwsh: true
          - task: PowerShell@2
            displayName: "Create Catalog"
            inputs:
              targetType: "inline"
              script: |
                New-FileCatalog `
                  -Path "$(Build.SourcesDirectory)/src/PsMyBackup" `
                  -CatalogFilePath "$(Build.SourcesDirectory)/src/PsMyBackup/PsMyBackup.cat" `
                  -CatalogVersion 2.0 `
                  -ErrorAction Stop
              pwsh: true
          - task: PowerShell@2
            displayName: "Sign Catalog"
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            env:
              SM_HOST: $(SM_HOST)
              SM_API_KEY: $(SM_API_KEY)
              SM_CLIENT_CERT_FILE: $(SM_CLIENT_CERT_FILE.secureFilePath)
              SM_CLIENT_CERT_PASSWORD: $(SM_CLIENT_CERT_PASSWORD)
            inputs:
              targetType: "inline"
              script: |
                $env:PATH += ';C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64'
                signtool.exe sign /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /sha1 $(SM_CERT_FINGERPRINT) $(Build.SourcesDirectory)/src/PsMyBackup/PsMyBackup.cat
                if ($LASTEXITCODE -ne 0) { throw 'Signing PsMyBackup.cat failed.' }
              failOnStderr: true
              pwsh: true
          - task: PowerShell@2
            displayName: "Verify packaged module and catalog"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                $moduleDirectory = '$(Build.SourcesDirectory)/src/PsMyBackup'
                $manifestPath = Join-Path $moduleDirectory 'PsMyBackup.psd1'
                $catalogPath = Join-Path $moduleDirectory 'PsMyBackup.cat'

                # Validate the versioned manifest, then compare every module file against the catalog's 
                # SHA-256 entries. The catalog file is excluded because it is not part of its own hash list.
                Test-ModuleManifest -Path $manifestPath -ErrorAction Stop | Out-Null
                $catalog = Test-FileCatalog `
                  -Path $moduleDirectory `
                  -CatalogFilePath $catalogPath `
                  -FilesToSkip @('PsMyBackup.cat') `
                  -Detailed `
                  -ErrorAction Stop
                if ($catalog.Status -ne 'Valid') {
                  throw "Catalog validation failed: $($catalog.Status)"
                }

                # Main builds are signed; feature branches deliberately are not. 
                # Check all three signatures before publishing the artifact.
                if ('$(Build.SourceBranch)' -eq 'refs/heads/main') {
                  foreach ($file in @('PsMyBackup.psm1', 'PsMyBackup.psd1', 'PsMyBackup.cat')) {
                    $signature = Get-AuthenticodeSignature -FilePath (Join-Path $moduleDirectory $file)
                    if ($signature.Status -ne 'Valid') {
                      throw "Invalid Authenticode signature for $file`: $($signature.Status)"
                    }
                  }
                }

                # Finally, verify that consumers can import the exact files to be published and that the
                # public command is available.
                try {
                  Import-Module -Name $manifestPath -Force -ErrorAction Stop
                  if (-not (Get-Command -Name Backup-MyFiles -Module PsMyBackup -ErrorAction SilentlyContinue)) {
                    throw 'Packaged module does not export Backup-MyFiles.'
                  }
                }
                finally {
                  Remove-Module PsMyBackup -ErrorAction SilentlyContinue
                }

          - publish: "$(Build.SourcesDirectory)/src/PsMyBackup"
            artifact: PsMyBackup

  - stage: github
    displayName: Publish Source
    dependsOn: packaging
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: push_to_github
        displayName: Push Source to GitHub
        steps:
          - checkout: self
            fetchTags: true
            fetchDepth: 0
          - task: PowerShell@2
            displayName: "Push to GitHub"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |

                $ErrorActionPreference = 'Stop'

                try {

                  # Configure the identity used by this automated Git job.
                  git config user.name  'azure-devops-bot'
                  git config user.email 'azuredevops@stueber.nomail'

                  # Add 'github' remote
                  git remote add github "https://$($env:PAT)@github.com/openpotato/psmybackup.git"

                  # Fetch remote main if it exists (ok to fail if repo is empty)
                  git fetch --prune github main
                  $fetchCode = $LASTEXITCODE

                  # If remote branch exists, only push when remote is an ancestor of HEAD (fast-forward safe)
                  if ($fetchCode -eq 0) {
                    git merge-base --is-ancestor github/main HEAD
                    if ($LASTEXITCODE -ne 0) {
                      throw 'GitHub main is not an ancestor of HEAD. Refusing a non-fast-forward push.'
                    }
                  }

                  # Push only the main branch (fast-forward or create remote if missing)
                  git push --tags github HEAD:refs/heads/main
                  if ($LASTEXITCODE -ne 0) {
                    throw "GitHub push failed with exit code $LASTEXITCODE."
                  }

                }
                finally {

                  # Remove the remote so the PAT isn't left in .git/config
                  git remote remove github 2>$null | Out-Null

                }
            env:
              PAT: $(PAT)

  - stage: deployment
    displayName: Deploy
    dependsOn: github
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: create_powershell_gallery_release
        displayName: Create Powershell Gallery Release
        steps:
          - download: current
            artifact: PsMyBackup
          - task: PowerShell@2
            displayName: "Publish to PS Gallery"
            env:
              NUGET_API_KEY: $(NuGetApiKey)
            inputs:
              targetType: "inline"
              script: |
                $ErrorActionPreference = 'Stop'

                $modulePath = Join-Path '$(Pipeline.Workspace)' 'PsMyBackup'
                Publish-Module -Path $modulePath -NuGetApiKey $env:NUGET_API_KEY -ErrorAction Stop

              pwsh: true
